<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" role="img" aria-label="PulseTrace: microservices feeding Prometheus, Loki and Jaeger, visualised in Grafana" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>PulseTrace: microservices feeding Prometheus, Loki and Jaeger, visualised in Grafana</title><style>
.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .f{font-family:Georgia,'Times New Roman',serif}
.flow{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><rect width="1000" height="445" rx="20" fill="#15111F"/><text class="f" x="40" y="44" text-anchor="start" font-size="22" font-weight="700" fill="#F4F0FF">PulseTrace</text><text class="s" x="40" y="68" text-anchor="start" font-size="14" font-weight="400" fill="#B9B0D6">In progress: observability added one signal at a time</text><rect x="40" y="120" width="200" height="80" rx="12" fill="#1F1930" stroke="#7C3AED" stroke-width="2"/><text class="s" x="140.0" y="156.0" text-anchor="middle" font-size="18" font-weight="600" fill="#F4F0FF">Node.js</text><text class="s" x="140.0" y="178.0" text-anchor="middle" font-size="14" fill="#B9B0D6">microservices</text><rect x="40" y="260" width="200" height="70" rx="12" fill="#1F1930" stroke="#7C3AED" stroke-width="2"/><text class="s" x="140.0" y="301.0" text-anchor="middle" font-size="18" font-weight="600" fill="#F4F0FF">PostgreSQL</text><line class="flow" x1="140" y1="200" x2="140" y2="260" stroke="#4B3F78" stroke-width="2.5"/><rect x="380" y="105" width="190" height="70" rx="12" fill="#1F1930" stroke="#F97368" stroke-width="2" stroke-dasharray="7 6"/><text class="s" x="475.0" y="136.0" text-anchor="middle" font-size="18" font-weight="600" fill="#F4F0FF">Prometheus</text><text class="s" x="475.0" y="158.0" text-anchor="middle" font-size="14" fill="#B9B0D6">metrics</text><line class="flow" x1="240" y1="160" x2="380" y2="140" stroke="#4B3F78" stroke-width="2.5"/><rect x="380" y="205" width="190" height="70" rx="12" fill="#1F1930" stroke="#F97368" stroke-width="2" stroke-dasharray="7 6"/><text class="s" x="475.0" y="236.0" text-anchor="middle" font-size="18" font-weight="600" fill="#F4F0FF">Loki</text><text class="s" x="475.0" y="258.0" text-anchor="middle" font-size="14" fill="#B9B0D6">logs</text><line class="flow" x1="240" y1="160" x2="380" y2="240" stroke="#4B3F78" stroke-width="2.5"/><rect x="380" y="305" width="190" height="70" rx="12" fill="#1F1930" stroke="#F97368" stroke-width="2" stroke-dasharray="7 6"/><text class="s" x="475.0" y="336.0" text-anchor="middle" font-size="18" font-weight="600" fill="#F4F0FF">Jaeger</text><text class="s" x="475.0" y="358.0" text-anchor="middle" font-size="14" fill="#B9B0D6">traces</text><line class="flow" x1="240" y1="160" x2="380" y2="340" stroke="#4B3F78" stroke-width="2.5"/><rect x="740" y="195" width="200" height="90" rx="12" fill="#1F1930" stroke="#A78BFA" stroke-width="2" stroke-dasharray="7 6"/><text class="s" x="840.0" y="236.0" text-anchor="middle" font-size="18" font-weight="600" fill="#F4F0FF">Grafana</text><text class="s" x="840.0" y="258.0" text-anchor="middle" font-size="14" fill="#B9B0D6">dashboards</text><line class="flow" x1="570" y1="140" x2="740" y2="240" stroke="#4B3F78" stroke-width="2.5"/><line class="flow" x1="570" y1="240" x2="740" y2="240" stroke="#4B3F78" stroke-width="2.5"/><line class="flow" x1="570" y1="340" x2="740" y2="240" stroke="#4B3F78" stroke-width="2.5"/><circle r="6" fill="#F97368"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M240 160 L380 140 L570 140 L740 240"/></circle><circle r="6" fill="#F97368"><animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" path="M240 160 L380 240 L570 240 L740 240"/></circle><circle r="6" fill="#F97368"><animateMotion dur="5s" begin="3.3s" repeatCount="indefinite" path="M240 160 L380 340 L570 340 L740 240"/></circle><text class="s" x="500" y="420" text-anchor="middle" font-size="14" font-weight="400" fill="#B9B0D6">Dashed boxes are the parts being added step by step.</text></svg>
