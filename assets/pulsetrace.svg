<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="PulseTrace: a gateway and two services with their own databases emit logs and metrics. Prometheus and Grafana are implemented; Loki, Jaeger and Alertmanager are planned.">
<title>PulseTrace architecture</title>
<defs>
<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b1740" stroke-opacity=".06"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b1740"/></marker>
</defs>
<style>
.t{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1b1740}
.s{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#4a4670}
.b{stroke:#1b1740;stroke-width:2.5}
.p{stroke-dasharray:6 5}
.f{fill:none;stroke:#1b1740;stroke-width:2.5;stroke-dasharray:6 6;marker-end:url(#a);animation:d 1.2s linear infinite}
.q{fill:none;stroke:#1b1740;stroke-opacity:.5;stroke-width:2.5;stroke-dasharray:6 6}
@keyframes d{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>
<rect x="1.25" y="1.25" width="1197.5" height="377.5" rx="22" fill="#eef0ff" class="b"/>
<rect x="1.25" y="1.25" width="1197.5" height="377.5" rx="22" fill="url(#g)"/>
<rect x="40" y="64" width="140" height="56" rx="12" fill="#fff" class="b"/><text x="110" y="89" text-anchor="middle" class="t">HTTP client</text><text x="110" y="107" text-anchor="middle" class="s">request ID</text>
<rect x="240" y="64" width="170" height="56" rx="12" fill="#dcf8ec" class="b"/><text x="325" y="89" text-anchor="middle" class="t">API Gateway</text><text x="325" y="107" text-anchor="middle" class="s">Express :3000</text>
<rect x="480" y="28" width="190" height="56" rx="12" fill="#dcf8ec" class="b"/><text x="575" y="53" text-anchor="middle" class="t">Order service</text><text x="575" y="71" text-anchor="middle" class="s">Express :3001</text>
<rect x="480" y="100" width="190" height="56" rx="12" fill="#dcf8ec" class="b"/><text x="575" y="125" text-anchor="middle" class="t">Payment service</text><text x="575" y="143" text-anchor="middle" class="s">Express :3002</text>
<rect x="740" y="28" width="200" height="56" rx="12" fill="#ffe6ec" class="b"/><text x="840" y="53" text-anchor="middle" class="t">Order DB</text><text x="840" y="71" text-anchor="middle" class="s">PostgreSQL 17</text>
<rect x="740" y="100" width="200" height="56" rx="12" fill="#ffe6ec" class="b"/><text x="840" y="125" text-anchor="middle" class="t">Payment DB</text><text x="840" y="143" text-anchor="middle" class="s">PostgreSQL 17</text>
<path d="M182 92H238" class="f"/>
<path d="M412 92H445V56H478" class="f"/>
<path d="M412 92H445V128H478" class="f"/>
<path d="M672 56H738" class="f"/>
<path d="M672 128H738" class="f"/>
<path d="M575 158V204" class="q"/>
<text x="587" y="186" class="s">structured logs + metrics, same request ID</text>
<path d="M140 204H1085" class="q"/>
<path d="M140 204V250" class="f"/><path d="M660 204V250" class="f"/><path d="M905 204V250" class="f"/><path d="M1085 204V250" class="f"/>
<rect x="40" y="252" width="200" height="60" rx="12" fill="#e3f1ff" class="b"/><text x="140" y="278" text-anchor="middle" class="t">Prometheus</text><text x="140" y="296" text-anchor="middle" class="s">scrapes all three</text>
<rect x="290" y="252" width="200" height="60" rx="12" fill="#e3f1ff" class="b"/><text x="390" y="278" text-anchor="middle" class="t">Grafana</text><text x="390" y="296" text-anchor="middle" class="s">rate · latency · errors</text>
<rect x="560" y="252" width="200" height="60" rx="12" fill="#fff8dc" class="b p"/><text x="660" y="278" text-anchor="middle" class="t">Fluent Bit + Loki</text><text x="660" y="296" text-anchor="middle" class="s">planned</text>
<rect x="810" y="252" width="190" height="60" rx="12" fill="#fff8dc" class="b p"/><text x="905" y="278" text-anchor="middle" class="t">OpenTelemetry + Jaeger</text><text x="905" y="296" text-anchor="middle" class="s">planned</text>
<rect x="1030" y="252" width="130" height="60" rx="12" fill="#fff8dc" class="b p"/><text x="1095" y="278" text-anchor="middle" class="t">Alertmanager</text><text x="1095" y="296" text-anchor="middle" class="s">planned</text>
<path d="M242 282H288" class="f"/>
<text x="600" y="352" text-anchor="middle" class="s">Solid = implemented · Dashed = planned · Next: Kubernetes</text>
</svg>
