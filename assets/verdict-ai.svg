<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-label="Verdict AI pipeline: question, fine-tuned multilingual embeddings, retrieval with LlamaIndex and Pinecone, answer, all served through FastAPI.">
<title>Verdict AI pipeline</title>
<defs>
<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b1740" stroke-opacity=".06"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b1740"/></marker>
</defs>
<style>
.t{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1b1740}
.s{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#4a4670}
.b{stroke:#1b1740;stroke-width:2.5}
.f{fill:none;stroke:#1b1740;stroke-width:2.5;stroke-dasharray:6 6;marker-end:url(#a);animation:d 1.2s linear infinite}
@keyframes d{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>
<rect x="1.25" y="1.25" width="1197.5" height="247.5" rx="22" fill="#eef0ff" class="b"/>
<rect x="1.25" y="1.25" width="1197.5" height="247.5" rx="22" fill="url(#g)"/>
<rect x="30" y="34" width="1140" height="140" rx="18" fill="#fff" fill-opacity=".55" stroke="#1b1740" stroke-width="2" stroke-dasharray="6 5"/>
<text x="48" y="56" class="s">FastAPI · Docker</text>
<rect x="60" y="76" width="200" height="76" rx="12" fill="#fff" class="b"/><text x="160" y="110" text-anchor="middle" class="t">Question</text><text x="160" y="130" text-anchor="middle" class="s">Egyptian criminal law</text>
<rect x="330" y="76" width="230" height="76" rx="12" fill="#ece6ff" class="b"/><text x="445" y="110" text-anchor="middle" class="t">Fine-tuned embeddings</text><text x="445" y="130" text-anchor="middle" class="s">multilingual model</text>
<rect x="630" y="76" width="260" height="76" rx="12" fill="#e3f1ff" class="b"/><text x="760" y="110" text-anchor="middle" class="t">Retrieval</text><text x="760" y="130" text-anchor="middle" class="s">LlamaIndex · Pinecone</text>
<rect x="960" y="76" width="180" height="76" rx="12" fill="#dcf8ec" class="b"/><text x="1050" y="110" text-anchor="middle" class="t">Answer</text><text x="1050" y="130" text-anchor="middle" class="s">from retrieved context</text>
<path d="M262 114H328" class="f"/><path d="M562 114H628" class="f"/><path d="M892 114H958" class="f"/>
<text x="600" y="214" text-anchor="middle" class="s">Retrieval-augmented generation · CS graduation project</text>
</svg>
