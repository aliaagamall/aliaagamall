<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-label="Pipeline from code to production: code, package, pipeline, infrastructure, orchestrate, observe, with the tools I use at each stage.">
<title>From code to production</title>
<defs>
<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b1740" stroke-opacity=".06"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b1740"/></marker>
</defs>
<style>
.t{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1b1740}
.s{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#4a4670}
.n{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#eef0ff}
.b{stroke:#1b1740;stroke-width:2.5}
.p{stroke-dasharray:6 5}
.f{fill:none;stroke:#1b1740;stroke-width:2.5;stroke-dasharray:6 6;marker-end:url(#a);animation:d 1.2s linear infinite}
@keyframes d{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>
<rect x="1.25" y="1.25" width="1197.5" height="227.5" rx="22" fill="#eef0ff" class="b"/>
<rect x="1.25" y="1.25" width="1197.5" height="227.5" rx="22" fill="url(#g)"/>
<g>
<rect x="45" y="50" width="160" height="76" rx="12" fill="#fff" class="b"/><circle cx="45" cy="50" r="13" fill="#1b1740"/><text x="45" y="54" text-anchor="middle" class="n">1</text>
<text x="125" y="84" text-anchor="middle" class="t">Code</text><text x="125" y="104" text-anchor="middle" class="s">Git · GitHub</text>
<rect x="235" y="50" width="160" height="76" rx="12" fill="#e3f1ff" class="b"/><circle cx="235" cy="50" r="13" fill="#1b1740"/><text x="235" y="54" text-anchor="middle" class="n">2</text>
<text x="315" y="84" text-anchor="middle" class="t">Package</text><text x="315" y="104" text-anchor="middle" class="s">Docker</text>
<rect x="425" y="50" width="160" height="76" rx="12" fill="#dcf8ec" class="b"/><circle cx="425" cy="50" r="13" fill="#1b1740"/><text x="425" y="54" text-anchor="middle" class="n">3</text>
<text x="505" y="84" text-anchor="middle" class="t">Pipeline</text><text x="505" y="104" text-anchor="middle" class="s">GitHub Actions</text>
<rect x="615" y="50" width="160" height="76" rx="12" fill="#ffe6ec" class="b"/><circle cx="615" cy="50" r="13" fill="#1b1740"/><text x="615" y="54" text-anchor="middle" class="n">4</text>
<text x="695" y="84" text-anchor="middle" class="t">Infrastructure</text><text x="695" y="104" text-anchor="middle" class="s">Terraform · AWS</text>
<rect x="805" y="50" width="160" height="76" rx="12" fill="#fff8dc" class="b p"/><circle cx="805" cy="50" r="13" fill="#1b1740"/><text x="805" y="54" text-anchor="middle" class="n">5</text>
<text x="885" y="84" text-anchor="middle" class="t">Orchestrate</text><text x="885" y="104" text-anchor="middle" class="s">Kubernetes (learning)</text>
<rect x="995" y="50" width="160" height="76" rx="12" fill="#ece6ff" class="b"/><circle cx="995" cy="50" r="13" fill="#1b1740"/><text x="995" y="54" text-anchor="middle" class="n">6</text>
<text x="1075" y="84" text-anchor="middle" class="t">Observe</text><text x="1075" y="104" text-anchor="middle" class="s">Prometheus · Grafana</text>
</g>
<path d="M207 88H233" class="f"/><path d="M397 88H423" class="f"/><path d="M587 88H613" class="f"/><path d="M777 88H803" class="f"/><path d="M967 88H993" class="f"/>
<path d="M1075 128V168H125V130" fill="none" stroke="#1b1740" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#a)"/>
<rect x="470" y="154" width="260" height="28" rx="14" fill="#ffd84d" class="b" stroke-width="2"/>
<text x="600" y="173" text-anchor="middle" class="s" style="fill:#1b1740">what you observe feeds the next change</text>
<text x="600" y="210" text-anchor="middle" class="s">Dashed stage = learning, not yet applied end to end</text>
