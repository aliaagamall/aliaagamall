eight="400" fill="#B9B0D6">The tools I work with, ordered by where they sit between a commit and a running system.</text><circle r="6" fill="#F97368"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M20 155.0 L980 155.0"/></circle><circle r="6" fill="#F97368"><animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M20 155.0 L980 155.0"/></circle></svg>
