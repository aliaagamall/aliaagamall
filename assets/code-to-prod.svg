<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Pipeline from code to production: code, package, pipeline, infrastructure, orchestrate, observe" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Pipeline from code to production: code, package, pipeline, infrastructure, orchestrate, observe</title><style>
.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .f{font-family:Georgia,'Times New Roman',serif}
.flow{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
