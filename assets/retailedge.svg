<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="RetailEdge architecture: user to CloudFront and WAF to private application and data layers, provisioned by Terraform" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>RetailEdge architecture: user to CloudFront and WAF to private application and data layers, provisioned by Terraform</title><style>
.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .f{font-family:Georgia,'Times New Roman',serif}
.flow{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><rect width="1000" height="430" rx="20" fill="#15111F"/><text class="f" x="40" y="44" text-anchor="start" font-size="22" font-weight="700" fill="#F4F0FF">RetailEdge</text><text class="s" x="40" y="68" text-anchor="start" font-size="14" font-weight="400" fill="#B9B0D6">Secure multi-tier AWS architecture</text><rect x="40" y="150" width="130" height="90" rx="12" fill="#1F1930" stroke="#A78BFA" stroke-width="2"/><text class="s" x="105.0" y="201.0" text-anchor="middle" font-size="18" font-weight="600" fill="#F4F0FF">User</text><rect class="pulse" x="230" y="150" width="180" height="90" rx="12" fill="#1F1930" stroke="#F97368" stroke-width="2"/><text class="s" x="320.0" y="191.0" text-anchor="middle" font-size="18" font-weight="600" fill="#F4F0FF">CloudFront</text><text class="s" x="320.0" y="213.0" text-anchor="middle" font-size="14" fill="#B9B0D6">+ WAF</text><rect x="470" y="100" width="490" height="190" rx="16" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="8 6"/><text class="m" x="490" y="126" text-anchor="start" font-size="14" font-weight="400" fill="#A78BFA">Private layers, least-privilege IAM</text><rect x="500" y="150" width="190" height="90" rx="12" fill="#1F1930" stroke="#7C3AED" stroke-width="2"/><text class="s" x="595.0" y="191.0" text-anchor="middle" font-size="18" font-weight="600" fill="#F4F0FF">Application</text><text class="s" x="595.0" y="213.0" text-anchor="middle" font-size="14" fill="#B9B0D6">private layer</text><rect x="740" y="150" width="190" height="90" rx="12" fill="#1F1930" stroke="#7C3AED" stroke-width="2"/><text class="s" x="835.0" y="191.0" text-anchor="middle" font-size="18" font-weight="600" fill="#F4F0FF">Data</text><text class="s" x="835.0" y="213.0" text-anchor="middle" font-size="14" fill="#B9B0D6">private layer</text><line class="flow" x1="170" y1="195" x2="230" y2="195" stroke="#4B3F78" stroke-width="2.5"/><line class="flow" x1="410" y1="195" x2="470" y2="195" stroke="#4B3F78" stroke-width="2.5"/><line class="flow" x1="690" y1="195" x2="740" y2="195" stroke="#4B3F78" stroke-width="2.5"/><rect x="40" y="340" width="920" height="60" rx="12" fill="#1F1930" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 6"/><text class="s" x="500.0" y="376.0" text-anchor="middle" font-size="18" font-weight="600" fill="#F4F0FF">Infrastructure defined with Terraform</text><line class="flow" x1="320" y1="340" x2="320" y2="240" stroke="#4B3F78" stroke-width="2"/><line class="flow" x1="595" y1="340" x2="595" y2="290" stroke="#4B3F78" stroke-width="2"/><line class="flow" x1="835" y1="340" x2="835" y2="290" stroke="#4B3F78" stroke-width="2"/><circle r="6" fill="#F97368"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M105 195 L320 195 L595 195 L835 195"/></circle><circle r="6" fill="#F97368"><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M105 195 L320 195 L595 195 L835 195"/></circle></svg>
