<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="RetailEdge architecture: user to Route 53, CloudFront and WAF, then S3 for the frontend and an internal ALB for the API, into a private EC2 Auto Scaling tier and RDS MySQL plus Redis, all defined with Terraform.">
<title>RetailEdge architecture</title>
<defs>
<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b1740" stroke-opacity=".06"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b1740"/></marker>
</defs>
<style>
.t{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1b1740}
.s{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#4a4670}
.b{stroke:#1b1740;stroke-width:2.5}
.f{fill:none;stroke:#1b1740;stroke-width:2.5;stroke-dasharray:6 6;marker-end:url(#a);animation:d 1.2s linear infinite}
@keyframes d{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>
<rect x="1.25" y="1.25" width="1197.5" height="417.5" rx="22" fill="#eef0ff" class="b"/>
<rect x="1.25" y="1.25" width="1197.5" height="417.5" rx="22" fill="url(#g)"/>
<rect x="735" y="150" width="440" height="190" rx="16" fill="#fff" fill-opacity=".55" stroke="#1b1740" stroke-width="2" stroke-dasharray="6 5"/>
<text x="751" y="171" class="s">private subnets</text>
<rect x="40" y="130" width="120" height="60" rx="12" fill="#fff" class="b"/><text x="100" y="157" text-anchor="middle" class="t">User</text><text x="100" y="175" text-anchor="middle" class="s">Browser</text>
<rect x="220" y="115" width="210" height="90" rx="12" fill="#e3f1ff" class="b"/><text x="325" y="152" text-anchor="middle" class="t">CloudFront + WAF</text><text x="325" y="172" text-anchor="middle" class="s">Route 53 · edge · protection</text>
<rect x="480" y="60" width="220" height="80" rx="12" fill="#e3f1ff" class="b"/><text x="590" y="94" text-anchor="middle" class="t">S3 frontend</text><text x="590" y="114" text-anchor="middle" class="s">Origin Access Control</text>
<rect x="480" y="200" width="220" height="80" rx="12" fill="#e3f1ff" class="b"/><text x="590" y="234" text-anchor="middle" class="t">Internal ALB</text><text x="590" y="254" text-anchor="middle" class="s">CloudFront VPC Origin</text>
<rect x="750" y="200" width="190" height="80" rx="12" fill="#dcf8ec" class="b"/><text x="845" y="234" text-anchor="middle" class="t">Private app tier</text><text x="845" y="254" text-anchor="middle" class="s">EC2 Auto Scaling · Docker</text>
<rect x="990" y="170" width="170" height="60" rx="12" fill="#ffe6ec" class="b"/><text x="1075" y="196" text-anchor="middle" class="t">RDS MySQL</text><text x="1075" y="214" text-anchor="middle" class="s">relational data</text>
<rect x="990" y="260" width="170" height="60" rx="12" fill="#ffe6ec" class="b"/><text x="1075" y="286" text-anchor="middle" class="t">Redis</text><text x="1075" y="304" text-anchor="middle" class="s">cache</text>
<path d="M162 160H218" class="f"/>
<path d="M430 160H455V100H478" class="f"/>
<path d="M430 160H455V240H478" class="f"/>
<path d="M702 240H748" class="f"/>
<path d="M942 240H965V200H988" class="f"/>
<path d="M942 240H965V290H988" class="f"/>
<rect x="40" y="360" width="1120" height="38" rx="12" fill="#fff8dc" stroke="#1b1740" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="600" y="384" text-anchor="middle" class="t">Terraform provisions every layer · GitHub Actions deploys</text>
</svg>
