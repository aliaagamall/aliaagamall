
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 360"
     role="img"
     aria-label="Aliaa Gamal, Computer Scientist. An interconnected overview of software engineering, cloud infrastructure, DevOps, reliability, security, and data and AI.">

  <title>Aliaa Gamal — Engineering Domains</title>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none"
            stroke="#1b1740" stroke-opacity=".055"/>
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4"
                    flood-color="#1b1740" flood-opacity=".08"/>
    </filter>

    <style>
      .heading {
        font: 800 68px 'Segoe UI', Helvetica, Arial, sans-serif;
        fill: #1b1740;
        letter-spacing: -2px;
      }

      .subtitle {
        font: 20px 'Segoe UI', Helvetica, Arial, sans-serif;
        fill: #4a4670;
      }

      .mono {
        font: 600 12px ui-monospace, SFMono-Regular, Consolas, monospace;
        fill: #4a4670;
      }

      .node-title {
        font: 700 15px 'Segoe UI', Helvetica, Arial, sans-serif;
        fill: #1b1740;
      }

      .node-sub {
        font: 11px ui-monospace, SFMono-Regular, Consolas, monospace;
        fill: #4a4670;
      }

      .connector {
        fill: none;
        stroke: #8e89ae;
        stroke-width: 1.7;
        stroke-opacity: .65;
      }

      .dot {
        fill: #1b1740;
      }

      .node {
        stroke: #1b1740;
        stroke-width: 1.5;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="1.25" y="1.25" width="1197.5" height="357.5"
        rx="22" fill="#eef0ff" stroke="#1b1740" stroke-width="2.5"/>

  <rect x="1.25" y="1.25" width="1197.5" height="357.5"
        rx="22" fill="url(#grid)"/>

  <!-- Left identity -->
  <rect x="55" y="45" width="105" height="27"
        rx="13.5" fill="#1b1740"/>

  <text x="107.5" y="63" text-anchor="middle"
        class="mono" fill="#eef0ff" style="fill:#eef0ff">
    $ whoami
  </text>

  <text x="53" y="151" class="heading">
    Aliaa Gamal
  </text>

  <text x="58" y="192" class="subtitle">
    Computer Scientist
  </text>

  <text x="58" y="226" class="subtitle">
    Engineering software and the systems
  </text>

  <text x="58" y="253" class="subtitle">
    that power reliable digital experiences.
  </text>

  <!-- Identity tags -->
  <rect x="58" y="285" width="116" height="29"
        rx="14.5" fill="#62b6ff" stroke="#1b1740" stroke-width="1.5"/>
  <text x="116" y="304" text-anchor="middle" class="mono">
    SOFTWARE
  </text>

  <rect x="184" y="285" width="103" height="29"
        rx="14.5" fill="#6fe3b2" stroke="#1b1740" stroke-width="1.5"/>
  <text x="235.5" y="304" text-anchor="middle" class="mono">
    CLOUD
  </text>

  <rect x="297" y="285" width="120" height="29"
        rx="14.5" fill="#a58bff" stroke="#1b1740" stroke-width="1.5"/>
  <text x="357" y="304" text-anchor="middle" class="mono">
    AUTOMATION
  </text>

  <!-- Right diagram heading -->
  <text x="895" y="40" text-anchor="middle" class="mono">
    ENGINEERING ECOSYSTEM
  </text>

  <text x="895" y="59" text-anchor="middle" class="node-sub">
    INTERCONNECTED DISCIPLINES
  </text>

  <!-- Connectors -->
  <g class="connector">
    <path d="M895 143 L895 105 L770 105 L770 94"/>
    <path d="M895 143 L895 105 L1020 105 L1020 94"/>

    <path d="M895 185 L895 218 L770 218 L770 231"/>
    <path d="M895 185 L895 218 L1020 218 L1020 231"/>

    <path d="M895 185 L895 285 L770 285 L770 300"/>
    <path d="M895 185 L895 285 L1020 285 L1020 300"/>
  </g>

  <!-- Central node -->
  <rect x="790" y="132" width="210" height="54"
        rx="13" fill="#1b1740" filter="url(#shadow)"/>

  <text x="895" y="155" text-anchor="middle"
        style="font:700 15px 'Segoe UI',Arial;fill:#ffffff">
    SYSTEMS
  </text>

  <text x="895" y="173" text-anchor="middle"
        style="font:700 15px 'Segoe UI',Arial;fill:#ffffff">
    ENGINEERING
  </text>

  <!-- Software -->
  <g filter="url(#shadow)">
    <rect x="665" y="70" width="210" height="65"
          rx="11" fill="#e3f1ff" class="node"/>
    <rect x="665" y="70" width="5" height="65"
          rx="2" fill="#62b6ff"/>
  </g>

  <text x="682" y="96" class="node-title">
    Software Engineering
  </text>
  <text x="682" y="117" class="node-sub">
    Backend · APIs · Design
  </text>

  <!-- Cloud -->
  <g filter="url(#shadow)">
    <rect x="915" y="70" width="210" height="65"
          rx="11" fill="#dcf8ec" class="node"/>
    <rect x="915" y="70" width="5" height="65"
          rx="2" fill="#6fe3b2"/>
  </g>

  <text x="932" y="96" class="node-title">
    Cloud Infrastructure
  </text>
  <text x="932" y="117" class="node-sub">
    Cloud · Networking · IaC
  </text>

  <!-- DevOps -->
  <g filter="url(#shadow)">
    <rect x="665" y="231" width="210" height="65"
          rx="11" fill="#eee8ff" class="node"/>
    <rect x="665" y="231" width="5" height="65"
          rx="2" fill="#a58bff"/>
  </g>

  <text x="682" y="257" class="node-title">
    DevOps &amp; Automation
  </text>
  <text x="682" y="278" class="node-sub">
    CI/CD · Docker · Kubernetes
  </text>

  <!-- Reliability -->
  <g filter="url(#shadow)">
    <rect x="915" y="231" width="210" height="65"
          rx="11" fill="#ffe6ec" class="node"/>
    <rect x="915" y="231" width="5" height="65"
          rx="2" fill="#ff8da7"/>
  </g>

  <text x="932" y="257" class="node-title">
    Reliability &amp; SRE
  </text>
  <text x="932" y="278" class="node-sub">
    Monitoring · Observability
  </text>

  <!-- Security -->
  <g filter="url(#shadow)">
    <rect x="665" y="300" width="210" height="42"
          rx="10" fill="#fff2c9" class="node"/>
  </g>

  <text x="770" y="326" text-anchor="middle" class="node-title">
    Security &amp; Networking
  </text>

  <!-- Data and AI -->
  <g filter="url(#shadow)">
    <rect x="915" y="300" width="210" height="42"
          rx="10" fill="#e3e8ff" class="node"/>
  </g>

  <text x="1020" y="326" text-anchor="middle" class="node-title">
    Data &amp; AI
  </text>

  <!-- Connection points -->
  <g class="dot">
    <circle cx="895" cy="105" r="3"/>
    <circle cx="895" cy="218" r="3"/>
    <circle cx="895" cy="285" r="3"/>
  </g>

</svg>
