<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Aliaa Gamal, computer scientist focused on cloud and DevOps. A request travels through CloudFront and WAF into private application and data layers.">
<title>Aliaa Gamal: cloud, software and infrastructure</title>
